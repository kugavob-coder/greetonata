<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A card for you — Greetonata</title>
<meta name="description" content="A card that plays music. Tap to open.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Greetonata">
<meta property="og:title" content="A card for you">
<meta property="og:description" content="A card that plays music. Tap to open.">
<meta property="og:image" content="https://greetonata.pages.dev/og/birthday.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5eddf;--surface:#fff9ef;--paper:#fffaf1;--ink:#493629;--muted:#7d6a57;--gold:#a87832;--gold2:#d9b66d;--line:#dfcba8;--btn:#3d2d20;--accent:#d97861;--accent-soft:#f2d5c5;
  --env:#f3e3cf;--env-dark:#e6cfb3;--env-line:#c9a77a;--seal:#9e2b25;--seal-hi:#c4463d}
body.celestial{--bg:#141a31;--surface:#202744;--paper:#1c2342;--ink:#e7c987;--muted:#c4ad7e;--gold:#d9b66d;--gold2:#f0d99b;--line:#6f5f4c;--btn:#2a2219;
  --env:#262e52;--env-dark:#1d2444;--env-line:#b8955a}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;transition:background .4s,color .4s;overflow-x:hidden}
body.celestial{background:#141a31 radial-gradient(ellipse at 50% 15%,#2f3660,#1b2340 45%,#141a31) fixed}
.app{max-width:460px;margin:0 auto;padding:12px 16px 40px}
.brand{font:600 24px 'Cormorant Garamond',serif;text-align:center;margin:6px 0 2px}
.brand span{color:var(--gold)}

/* ---------- envelope ---------- */
.stage{position:relative;min-height:470px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hello{font:italic 22px 'Cormorant Garamond',serif;color:var(--muted);text-align:center;margin-bottom:28px;transition:opacity .5s}
.hello b{font-style:normal;font-weight:600;color:var(--ink)}
.env{position:relative;width:310px;height:205px;perspective:900px;transition:transform .8s cubic-bezier(.5,0,.3,1),opacity .8s}
.env .back{position:absolute;inset:0;background:var(--env);border-radius:6px;box-shadow:0 18px 36px #5a412433}
body.celestial .env .back{box-shadow:0 18px 36px #0008}
.env .peek{z-index:2;position:absolute;left:14px;right:14px;top:14px;height:180px;background:var(--paper);border-radius:4px;box-shadow:0 2px 6px #0002;transition:transform 1s cubic-bezier(.3,.1,.2,1);display:flex;flex-direction:column;align-items:center;padding-top:16px}
.env .peek canvas{width:120px;height:120px}
.env .peek i{display:block;width:60%;height:3px;border-radius:2px;background:var(--line);margin-top:8px}
.env .pocket{z-index:3;position:absolute;inset:0;pointer-events:none}
.env .pocket svg{width:100%;height:100%;display:block}
.env .flap{position:absolute;left:0;right:0;top:0;height:120px;transform-origin:top center;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.5,0,.3,1);z-index:4}
.env .flap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px #0002)}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.out .peek{transform:translateY(-150px)}
.env.gone{transform:translateY(160px);opacity:0}

.seal{position:absolute;left:50%;top:120px;width:76px;height:76px;margin:-38px 0 0 -38px;z-index:6;cursor:pointer;border:0;background:none;padding:0;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.seal .half{position:absolute;inset:0;transition:transform .9s cubic-bezier(.4,0,.6,1),opacity .9s}
.seal .half.l{clip-path:polygon(0 0,52% 0,44% 30%,55% 55%,46% 100%,0 100%)}
.seal .half.r{clip-path:polygon(52% 0,100% 0,100% 100%,46% 100%,55% 55%,44% 30%)}
.seal.crack{animation:none}
.seal.crack .half.l{transform:translate(-40px,90px) rotate(-35deg);opacity:0}
.seal.crack .half.r{transform:translate(40px,95px) rotate(30deg);opacity:0}
.wax{position:absolute;inset:0;border-radius:47% 53% 50% 50%/52% 48% 52% 48%;background:radial-gradient(circle at 35% 30%,var(--seal-hi),var(--seal) 60%,#5e1612);box-shadow:0 4px 8px #0005,inset 0 -3px 6px #0004,inset 0 2px 4px #fff3}
.wax::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1.5px solid #ffffff30;box-shadow:inset 0 1px 3px #0005}
.wax canvas{position:absolute;inset:11px;width:54px;height:54px}
.tap{font-size:13px;color:var(--muted);text-align:center;margin-top:34px;letter-spacing:1px;text-transform:uppercase;transition:opacity .4s}

/* ---------- the card (same as screen V) ---------- */
.cardx{position:relative;background:var(--paper);border-radius:8px;padding:26px 22px 30px;box-shadow:0 14px 34px #5a412422;overflow:hidden;width:100%;display:none}
.cardx.show{display:block;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.82)}to{opacity:1;transform:none}}
body.celestial .cardx{box-shadow:0 14px 34px #0007}
.cardx::before,.cardx::after{content:"";position:absolute;pointer-events:none}
.cardx.warm::before{inset:9px;border:1.5px solid var(--accent);border-radius:16px;opacity:.75}
.cardx.warm::after{inset:14px;border:1px solid var(--accent);border-radius:12px;opacity:.3}
.cardx.playful::before{inset:9px;border:3px dotted var(--accent);border-radius:12px;opacity:.8}
.cardx.festive::before{inset:8px;border:1.5px solid var(--gold)}
.cardx.festive::after{inset:13px;border:.8px solid var(--gold);opacity:.7}
.corner{position:absolute;width:46px;height:46px;pointer-events:none;display:none;color:var(--gold)}
.cardx.festive .corner{display:block}
.corner.tl{top:4px;left:4px}.corner.tr{top:4px;right:4px;transform:scaleX(-1)}
.corner.bl{bottom:4px;left:4px;transform:scaleY(-1)}.corner.br{bottom:4px;right:4px;transform:scale(-1,-1)}
.confetti{position:absolute;pointer-events:none}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.envfx{position:absolute;left:-70px;top:-70px;width:450px;height:345px;pointer-events:none;z-index:7}
#shape{width:100%;max-width:230px;aspect-ratio:1;display:block;margin:-6px auto 6px;position:relative}
.msg{font:500 20px/1.45 'Cormorant Garamond',serif;color:var(--ink);white-space:pre-wrap;position:relative;text-align:left;padding:0 6px}
.msg span{transition:opacity .35s,color .6s}
.msg span.wait{opacity:.12}
.msg span.now{color:var(--accent)}
.msg span.key{color:var(--accent);font-weight:600}
.primary{display:none;width:100%;border:1px solid var(--gold);background:linear-gradient(135deg,#bd8b43,#e0bd75);color:var(--btn);padding:15px;border-radius:30px;font:700 16px 'DM Sans',sans-serif;box-shadow:0 4px 0 #9b6e31;cursor:pointer;margin-top:20px}
.primary.show{display:block}
[hidden]{display:none!important}
/* the gift inside the envelope */
.gift{margin-top:20px;background:var(--surface);border:1.5px solid var(--gold);border-radius:16px;padding:18px 18px 16px;text-align:center;box-shadow:0 10px 26px #674c2920;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.gift svg{width:64px;height:64px;display:block;margin:0 auto 6px}
.gift h3{font:600 28px 'Cormorant Garamond',serif;color:var(--ink)}
.gift p{font:italic 17px 'Cormorant Garamond',serif;color:var(--muted);margin-top:2px}
.gift label{display:block;text-align:left;font:italic 17px 'Cormorant Garamond',serif;color:var(--muted);margin:14px 0 4px}
.gift input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);font:16px 'DM Sans',sans-serif;outline:none}
.gift input:focus{border-color:var(--gold)}
.gift .hint{font:13px 'DM Sans',sans-serif;font-style:normal;margin-top:8px}
.gift .msg2{font:15px 'DM Sans',sans-serif;font-style:normal;color:var(--accent);margin-top:10px;min-height:20px}
.gift .ok{color:var(--gold);font-weight:600}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #9b6e31}
.demo{background:var(--accent-soft);color:var(--ink);text-align:center;font-size:13px;padding:6px 12px;border-bottom:1px solid var(--line)}
.missing{font:italic 22px 'Cormorant Garamond',serif;color:var(--muted);text-align:center;margin-top:80px}
.make{display:block;text-align:center;margin-top:22px;color:var(--gold);font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="demo">Demo — PayPal sandbox, no real money.</div>
<div class="app">
  <div class="brand">Greetonata<span> ✳</span></div>

  <div class="stage" id="stage">
    <p class="hello" id="hello"></p>
    <div class="env" id="env">
      <div class="back"></div>
      <div class="peek"><canvas id="peekCv"></canvas><i></i><i style="width:45%"></i></div>
      <div class="pocket"><svg viewBox="0 0 310 205" preserveAspectRatio="none">
        <path d="M0 6Q0 0 6 0L155 118L0 205Z" fill="var(--env-dark)"/>
        <path d="M310 6Q310 0 304 0L155 118L310 205Z" fill="var(--env-dark)"/>
        <path d="M0 205L155 104L310 205Z" fill="var(--env)"/>
        <path d="M0 205L155 104L310 205" fill="none" stroke="var(--env-line)" stroke-width="1"/>
      </svg></div>
      <div class="flap"><svg viewBox="0 0 310 120" preserveAspectRatio="none">
        <path d="M0 0H310L163 116Q155 122 147 116Z" fill="var(--env)"/>
        <path d="M0 0L147 116Q155 122 163 116L310 0" fill="none" stroke="var(--env-line)" stroke-width="1"/>
      </svg></div>
      <canvas class="envfx" id="envfx"></canvas>
      <button class="seal" id="seal" aria-label="Open the card">
        <span class="half l"><span class="wax"><canvas class="sealCv"></canvas></span></span>
        <span class="half r"><span class="wax"><canvas class="sealCv"></canvas></span></span>
      </button>
    </div>
    <p class="tap" id="tap">Tap the seal to open</p>

    <div class="cardx warm" id="card">
      <svg class="corner tl" viewBox="0 0 46 46"><path d="M4 42V12Q4 4 12 4h30M10 36V16q0-6 6-6h20M16 16q8 2 10 10" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="27" cy="27" r="2.2" fill="currentColor"/></svg>
      <svg class="corner tr" viewBox="0 0 46 46"><path d="M4 42V12Q4 4 12 4h30M10 36V16q0-6 6-6h20M16 16q8 2 10 10" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="27" cy="27" r="2.2" fill="currentColor"/></svg>
      <svg class="corner bl" viewBox="0 0 46 46"><path d="M4 42V12Q4 4 12 4h30M10 36V16q0-6 6-6h20M16 16q8 2 10 10" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="27" cy="27" r="2.2" fill="currentColor"/></svg>
      <svg class="corner br" viewBox="0 0 46 46"><path d="M4 42V12Q4 4 12 4h30M10 36V16q0-6 6-6h20M16 16q8 2 10 10" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="27" cy="27" r="2.2" fill="currentColor"/></svg>
      <canvas id="shape"></canvas>
      <canvas class="fx" id="fx"></canvas>
      <div class="msg" id="msg"></div>
    </div>
    <button class="primary" id="again">▶ Play again</button>
    <div class="gift" id="gift" hidden>
      <svg viewBox="0 0 64 64" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round">
        <rect x="10" y="26" width="44" height="30" rx="3" fill="var(--accent-soft)"/><rect x="7" y="18" width="50" height="10" rx="3" fill="var(--accent-soft)"/>
        <path d="M32 18v38"/><path d="M32 18c-4-10-16-12-15-4 1 6 15 4 15 4zM32 18c4-10 16-12 15-4-1 6-15 4-15 4z" fill="var(--accent-soft)"/>
      </svg>
      <h3 id="giftTitle"></h3>
      <p id="giftFrom"></p>
      <button class="primary show" id="claimBtn">Claim your gift</button>
      <div id="claimForm" hidden>
        <label for="claimEmail">Your PayPal email</label>
        <input type="email" id="claimEmail" autocomplete="email" placeholder="you@example.com">
        <button class="primary show" id="sendGift">Send it to my PayPal</button>
        <p class="hint">Demo: use the email of a PayPal sandbox account.</p>
      </div>
      <p class="msg2" id="giftMsg"></p>
    </div>
  </div>
  <p class="missing" id="missing" hidden>This card could not be found.</p>
  <a class="make" href="/">Make your own card</a>
</div>
<script src="/js/engine.js"></script>
<script>
let occ='birthday', mood='warm', celestial=false, cardText='', scene=null, cardData=null;
const cv=document.getElementById('shape'),msgEl=document.getElementById('msg'),cardEl=document.getElementById('card');
const env=document.getElementById('env'),seal=document.getElementById('seal');
const FXC=makeFx(document.getElementById('fx')),FXE=makeFx(document.getElementById('envfx'));
let spans=[],playing=null,raf=0;

/* ================= load the card from the private link ================= */
async function loadCard(){
  const id=(location.pathname.match(/\/c\/([A-Za-z0-9]+)/)||[])[1]||new URLSearchParams(location.search).get('id');
  try{
    if(window.PREVIEW_CARD)cardData=window.PREVIEW_CARD;
    else{const r=await fetch('/api/card/'+encodeURIComponent(id||''));if(!r.ok)throw 0;cardData=await r.json();}
  }catch(e){document.getElementById('stage').hidden=true;document.getElementById('missing').hidden=false;return;}
  occ=cardData.occasion;mood=cardData.mood;celestial=cardData.style==='celestial';cardText=cardData.text;AI=cardData.ai||null;
  document.body.classList.toggle('celestial',celestial);
  document.title=`A card for ${cardData.to} — Greetonata`;
  setupEnvelope();
}

/* ================= closed envelope ================= */
function setupEnvelope(){
  scene={...chooseShape(cardText)};normT(scene.els);
  document.body.style.setProperty('--accent',scene.accent);
  const SOFT={birthday:'#f2d5c5',celebration:'#f1d3dc',xmas:'#d8e6cf',thanks:'#f5dcc0'}[occ];
  document.body.style.setProperty('--accent-soft',celestial?'#2f365c':SOFT);
  const SEAL={birthday:['#9e2b25','#c4463d'],celebration:['#8a2f5c','#b4507f'],xmas:['#1f4f3a','#357a5a'],thanks:['#9a5a1c','#c27a33']}[occ];
  document.body.style.setProperty('--seal',SEAL[0]);document.body.style.setProperty('--seal-hi',SEAL[1]);
  const hello=document.getElementById('hello');hello.innerHTML='';
  hello.append('A card for ',Object.assign(document.createElement('b'),{textContent:cardData.to}));
  cardEl.className='cardx '+mood;
  document.querySelectorAll('.sealCv').forEach(c=>{sizeCanvas(c,54);paint(c.getContext('2d'),scene.els,1,'rgba(255,235,205,.95)');});
  const pk=document.getElementById('peekCv');sizeCanvas(pk,120);paint(pk.getContext('2d'),scene.els,1,null);
  sizeFx(FXE);FXE.on=true;
}

/* ================= opening ================= */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function openEnvelope(){
  seal.disabled=true;
  const loading=loadPiano().catch(()=>null);
  crackSound();
  seal.classList.add('crack');FXE.on=false;
  document.getElementById('tap').style.opacity=0;
  await wait(550);
  env.classList.add('open');document.getElementById('hello').style.opacity=0;
  await wait(750);
  env.classList.add('out');
  await wait(1000);
  env.classList.add('gone');
  await wait(500);
  env.style.display='none';
  showCard();
  await loading;
  await wait(700);
  play();
}
function crackSound(){
  try{const a=new(window.AudioContext||window.webkitAudioContext)(),t=a.currentTime,n=a.sampleRate*.12,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=1800;g.gain.value=.5;
    s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);setTimeout(()=>a.close(),400);}catch(e){}
}
function showCard(){
  cardEl.className='cardx show '+mood;
  sizeCanvas(cv,cv.clientWidth||300);scene.ctx=cv.getContext('2d');
  spans=fillMessage(msgEl,cardText,true);
  paint(scene.ctx,scene.els,0,null);
  requestAnimationFrame(()=>cardToTop(cardEl));
  requestAnimationFrame(()=>{FXE.parts=[];sizeFx(FXC);FXC.parts=[];FXC.on=true;});
}
function stopCard(){
  if(playing){playing.srcs.forEach(s=>{try{s.stop()}catch(e){}});playing=null;}
  cancelAnimationFrame(raf);
}
async function play(){
  stopCard();cardToTop(cardEl);
  document.getElementById('again').classList.remove('show');
  if(!buffers){try{await loadPiano();}catch(e){spans.forEach(s=>s.classList.remove('wait'));paint(scene.ctx,scene.els,1,null);document.getElementById('again').classList.add('show');return;}}
  const song=compose(cardText),t0=actx.currentTime+.2,srcs=[];
  for(const n of[...song.notes,...song.bass,...song.fin])srcs.push(key(n.midi,t0+n.t,n.dur,n.vol));
  playing={srcs};
  spans.forEach(s=>{s.classList.add('wait');s.classList.remove('now','key');});
  const tick=()=>{
    if(!playing)return;
    const el=actx.currentTime-t0;
    paint(scene.ctx,scene.els,clamp(el/song.total),null);
    for(const w of song.words){const s=spans[w.word];if(!s)continue;
      if(el>=w.t){if(s.classList.contains('wait')){emitEdge(FXC,w.key?5:(mood==='warm'?1:2));if(w.key)s.classList.add('key');followWord(s);}s.classList.remove('wait');s.classList.toggle('now',el<w.t+.45);}}
    if(el<song.total+.6)raf=requestAnimationFrame(tick);
    else{playing=null;spans.forEach(s=>s.classList.remove('wait','now'));document.getElementById('again').classList.add('show');showGift();}
  };
  raf=requestAnimationFrame(tick);
}

/* ================= sparkles ================= */
let fxLast=0,idleAcc=0,envAcc=0;
function fxLoop(now){
  const dt=Math.min(.05,(now-(fxLast||now))/1000);fxLast=now;
  if(FXC.on&&!playing){idleAcc+=dt*IDLE_RATE[mood];while(idleAcc>=1){emitEdge(FXC,1);idleAcc--;}}
  if(FXE.on){envAcc+=dt*2.2;while(envAcc>=1){const a=Math.random()*6.28,d=48+Math.random()*30;
    spawn(FXE,occ==='thanks'?(Math.random()<.5?'heart':'twinkle'):'twinkle',FXE.w/2+Math.cos(a)*d,190+Math.sin(a)*d*.8);envAcc--;}}
  if(FXE.w)fxStep(FXE,dt);
  if(FXC.on)fxStep(FXC,dt);
  requestAnimationFrame(fxLoop);
}
requestAnimationFrame(fxLoop);

/* ================= the gift ================= */
let giftShown=false;
function showGift(){
  if(giftShown||!cardData.gift)return;giftShown=true;
  const box=document.getElementById('gift');
  document.getElementById('giftTitle').textContent=`A $${cardData.gift} gift for you`;
  document.getElementById('giftFrom').textContent=cardData.giftClaimed?'This gift has already been claimed.':`from ${cardData.from}, tucked inside the envelope`;
  document.getElementById('claimBtn').hidden=!!cardData.giftClaimed;
  box.hidden=false;
  for(let i=0;i<6;i++)setTimeout(()=>emitEdge(FXC,2),i*120);
  setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'center'}),300);
}
document.getElementById('claimBtn').onclick=()=>{
  document.getElementById('claimBtn').hidden=true;document.getElementById('claimForm').hidden=false;
  document.getElementById('claimEmail').focus();
};
document.getElementById('sendGift').onclick=async()=>{
  const btn=document.getElementById('sendGift'),msg=document.getElementById('giftMsg'),email=document.getElementById('claimEmail').value.trim();
  msg.className='msg2';msg.textContent='';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg.textContent='Please enter a valid email address.';return;}
  btn.disabled=true;btn.textContent='Sending…';
  let ok=false,text='';
  if(window.PREVIEW_CARD){ok=true;}
  else{
    const id=(location.pathname.match(/\/c\/([A-Za-z0-9]+)/)||[])[1]||new URLSearchParams(location.search).get('id');
    try{const r=await fetch('/api/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,email})});
      const d=await r.json().catch(()=>({}));ok=r.ok&&d.ok;text=d.error||'';}
    catch(e){text='The gift could not be sent right now. Please try again.';}
  }
  if(ok){
    document.getElementById('claimForm').hidden=true;
    msg.className='msg2 ok';msg.textContent=`Your $${cardData.gift} is on its way to your PayPal.`;
    for(let i=0;i<10;i++)setTimeout(()=>emitEdge(FXC,2),i*90);
  }else{
    btn.disabled=false;btn.textContent='Send it to my PayPal';
    msg.textContent=text||'The gift could not be sent right now. Please try again.';
  }
};

seal.onclick=openEnvelope;
document.getElementById('again').onclick=play;
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(loadCard);else loadCard();
</script>
</body>
</html>
